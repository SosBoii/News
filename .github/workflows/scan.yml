# סריקה אוטומטית: מריץ את fetch.py פעמיים ביום ושומר את feed.json המעודכן במאגר.
# GitHub Pages מגיש את index.html ואת feed.json – והטלפון קורא משם.
#
# השעות ב-UTC. ישראל: UTC+3 בקיץ, UTC+2 בחורף.
#   04:00 UTC = 07:00 בקיץ / 06:00 בחורף
#   15:00 UTC = 18:00 בקיץ / 17:00 בחורף
# GitHub מריץ לפעמים באיחור של 5–30 דקות – זה נורמלי.

name: סריקת חדשות

on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch: {}          # כפתור "Run workflow" – סריקה ידנית מתי שרוצים

permissions:
  contents: write                # כדי לשמור את feed.json במאגר

concurrency:
  group: news-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: התקנה
        run: pip install -r requirements.txt pytest

      - name: בדיקות (אם משהו נשבר – לא דורסים את הפיד)
        run: python -m pytest -q tests

      - name: סריקה
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch.py

      - name: שמירת feed.json
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          if git diff --cached --quiet; then
            echo "אין שינוי בפיד"
            exit 0
          fi
          git commit -m "feed: $(date -u +'%Y-%m-%d %H:%M') UTC"
          # אם ערכת את config.yaml בזמן הסריקה – מושכים קודם ואז דוחפים
          git pull --rebase --autostash
          git push
